<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Plum background with rounded corners -->
  <rect width="64" height="64" rx="14" fill="#633645"/>

  <!-- Outer circle -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#f2e7d9" stroke-width="3"/>

  <!-- Center circle -->
  <circle cx="32" cy="32" r="8" fill="none" stroke="#f2e7d9" stroke-width="3"/>

  <!-- Dividing lines from inner circle to outer circle -->
  <!-- Top -->
  <line x1="32" y1="24" x2="32" y2="9" stroke="#f2e7d9" stroke-width="3" stroke-linecap="round"/>
  <!-- Bottom -->
  <line x1="32" y1="40" x2="32" y2="55" stroke="#f2e7d9" stroke-width="3" stroke-linecap="round"/>
  <!-- Left -->
  <line x1="24" y1="32" x2="9" y2="32" stroke="#f2e7d9" stroke-width="3" stroke-linecap="round"/>
  <!-- Right -->
  <line x1="40" y1="32" x2="55" y2="32" stroke="#f2e7d9" stroke-width="3" stroke-linecap="round"/>
</svg>
