# mertyas.in on the server: nginx over the synced files, no public port; the shared Caddy
# reaches it over the external `proxy` network.
services:
  mertyas-in:
    image: nginx:alpine
    container_name: mertyas-in
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    networks: [web]
    mem_limit: 32m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 60s
      timeout: 5s
      retries: 3

networks:
  web:
    external: true
    name: proxy
